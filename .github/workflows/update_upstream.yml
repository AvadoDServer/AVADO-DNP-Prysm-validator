name: Update Prysm Upstream Version

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  # First merge and release an update whose Build passed and whose wait is
  # over (rules: AvadoDServer/ci-release-action/automerge), then look upstream.
  automerge:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: { contents: write, pull-requests: write, actions: read }
    steps:
      - uses: AvadoDServer/ci-release-action/automerge@main
        with:
          rpcToken: ${{ secrets.RPC_TOKEN }}
          enabled: ${{ vars.AUTOMERGE }}
  check-and-update:
    needs: automerge
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Run update script
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/update_upstream.py
      
      - id: cpr
        name: Create Pull Request
        if: steps.update.outputs.update_available == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            Update Prysm upstream to ${{ steps.update.outputs.new_upstream }}
            
            - Package version: ${{ steps.update.outputs.old_version }} → ${{ steps.update.outputs.new_version }}
            - Upstream version: ${{ steps.update.outputs.old_upstream }} → ${{ steps.update.outputs.new_upstream }}
          branch: automated/update-prysm-${{ steps.update.outputs.new_upstream }}
          delete-branch: true
          title: 'Update Prysm upstream to ${{ steps.update.outputs.new_upstream }}'
          body: |
            ## Automated Prysm Upstream Update
            
            This PR updates the Prysm upstream version for **mainnet** configuration.
            
            ### Changes
            - **Package version**: `${{ steps.update.outputs.old_version }}` → `${{ steps.update.outputs.new_version }}`
            - **Upstream version**: `${{ steps.update.outputs.old_upstream }}` → `${{ steps.update.outputs.new_upstream }}`
            
            ### Files Updated
            - `dappnode_package.json`
            - `dappnode_package-mainnet.json`
            - `docker-compose.yml` (published by the release action - the build arg here is what actually gets built)
            - `build/docker-compose.yml`
            - `build/docker-compose-mainnet.yml` (template `setNetwork.sh` hard-links over the live file)
            
            ### Release Notes
            See the upstream release notes at: https://github.com/OffchainLabs/prysm/releases/tag/${{ steps.update.outputs.new_upstream }}
            cc @flisko
            ---
            *This PR was automatically created by the update-upstream workflow.*
          labels: |
            automated
            upstream-update
          assignees: ''
          reviewers: ''
      # The workflow token starts no pull_request workflow: start the Build here.
      - name: Build the pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          branch=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json headRefName -q .headRefName)
          gh workflow run build.yml -R "$GITHUB_REPOSITORY" --ref "$branch" -f pr="$PR"
